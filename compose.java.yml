name: jobfinder-java-dev
services:
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: jobfinder
      POSTGRES_USER: jobfinder_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - java_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder_dev -d jobfinder"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  java_pgdata:
