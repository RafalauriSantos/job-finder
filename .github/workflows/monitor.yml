name: Job Monitor

on:
  schedule:
    # Duas tentativas por hora, fora do minuto 00. A deduplicação em
    # seen_jobs.json torna uma segunda tentativa segura quando a primeira
    # foi atrasada ou perdida pelo agendador do GitHub.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python e dependências
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar código em execução manual
        if: github.event_name == 'workflow_dispatch'
        run: python -m pytest -q

      - name: Validar credenciais de entrega
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID não configurado."
            exit 1
          fi
          echo "Credenciais mínimas do Telegram presentes (valores ocultos)."

      - name: Executar coleta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py --once

      - name: Exibir saúde do ciclo
        if: always()
        shell: bash
        run: |
          if [ -f cycle_health.json ]; then
            cat cycle_health.json
            {
              echo '### Saúde do ciclo'
              echo '```json'
              cat cycle_health.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::cycle_health.json não foi produzido nesta execução."
            exit 1
          fi

      - name: Persistir estado e telemetria
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs.json
          if [ -f cycle_health.json ]; then
            git add -f cycle_health.json
          fi
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no estado ou telemetria."
            exit 0
          fi
          git commit -m "chore: atualizar estado e saúde do radar [skip ci]"
          git push origin "${GITHUB_REF_NAME}"
