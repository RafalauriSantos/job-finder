name: Job Monitor

on:
  schedule:
    - cron: '0 * * * 0,6' # Fins de semana: executa a cada hora
    - cron: '0 */3 * * 1-5' # Segunda a sexta: executa a cada 3 horas
  workflow_dispatch:        # Permite disparar manualmente pelo GitHub

concurrency:
  group: job-monitor
  cancel-in-progress: true

jobs:
  check-jobs:
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Preparar Python do runner
        run: |
          $pythonDir = 'C:\actions-runner\python'
          $python = Join-Path $pythonDir 'python.exe'
          if (!(Test-Path $python)) {
            $installer = 'C:\actions-runner\_work\_tool\Python\3.12.10\python-3.12.10-amd64.exe'
            if (!(Test-Path $installer)) { throw "Python installer not found: $installer" }
            & $installer /quiet InstallAllUsers=0 TargetDir=$pythonDir Include_pip=1 Include_test=0 Include_launcher=0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "$pythonDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $python --version
          & $python -m pip --version

      - name: Instalar dependências
        run: |
          C:\actions-runner\python\python.exe -m pip install -r requirements.txt

      - name: Rodar testes automatizados
        if: github.event_name == 'workflow_dispatch'
        run: |
          C:\actions-runner\python\python.exe -m pytest -v

      - name: Executar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          C:\actions-runner\python\python.exe monitor.py --once

      - name: Persistir vagas já vistas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: atualizar vagas vistas [skip ci]"
            $branch = $env:GITHUB_REF_NAME
            if ([string]::IsNullOrWhiteSpace($branch)) { $branch = "main" }
            git pull --rebase origin $branch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin $branch
          }

