name: Job Monitor

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada 1 hora
  workflow_dispatch:        # Permite disparar manualmente pelo GitHub

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python monitor.py --once

      - name: Persistir vagas já vistas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualizar vagas vistas [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

